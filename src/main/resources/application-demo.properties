# ==============================================================
# Demo profile: in-memory H2 database.
# Use this if MySQL is not installed / you just want to try the
# app instantly:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
# ==============================================================
spring.datasource.url=jdbc:h2:mem:smsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console for inspecting the schema/data visually during grading:
# available at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:smsdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
