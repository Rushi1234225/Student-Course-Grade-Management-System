# ==============================================================
# MySQL profile (default / "real-world" database)
# ==============================================================
# Before running: create the database with:
#   CREATE DATABASE sms_db;
# Update username/password below to match your local MySQL install.

spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate will auto-create/update tables based on the entity classes
# on startup ("update" = safe for coursework; never drops existing data).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
