# ==============================================================
# Student Course & Grade Management System - Main Configuration
# ==============================================================
spring.application.name=student-management-system
server.port=8080

# Active profile: "mysql" (default, production-style DB) or "demo" (H2, zero setup)
spring.profiles.active=mysql

# --- Jackson: pretty-print JSON responses, ignore null fields cleanly ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- Global error handling: let our GlobalExceptionHandler own error responses ---
server.error.include-message=always
server.error.include-binding-errors=always
